name: Agent Search Pro uptime

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://aggregator-beta.vercel.app/health
